<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper and Scissor Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Rock Paper and Scissor Game</h1>
    <div id="buttons">
    <button id="rock" class = "choice"><img src = "image.png">Rock</button>
    <button id="paper" class = "choice"><img src = "image copy.png" height="298">Paper</button>
    <button id="scissors" class = "choice"><img src = "Screenshot 2026-10-04 151422.png" height="298">Scissor</button>
    </div>

    <div id="result">
        <p id = "your-result">User Win count: 0</p>
        <p id = "computer-result">Computer Win Count: 0 </p>
    </div>
    <div>
        <p id="message">Result will be declared here </p>
    </div>
    <button id = "reset">Click here to Reset the Game!</button>
    <script src="script.js"></script>
</body>
</html>
